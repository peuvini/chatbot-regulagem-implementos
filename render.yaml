services:
  - type: web
    name: arips-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd app/backend && alembic upgrade head && python -m app.scripts.initialize_production && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
